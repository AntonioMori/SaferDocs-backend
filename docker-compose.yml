services:
  # ---------------------------------------------------------------------------
  # Banco de dados PostgreSQL (credenciais vêm do apps/backend/.env)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ./apps/backend/.env
        required: true
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # API (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
    env_file:
      - path: ./apps/backend/.env
        required: true
    # Aplica as migrations pendentes e sobe a API com hot-reload.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      pdf-worker:
        condition: service_started
    # Grupo do pdf-worker: dá acesso ao socket dele, e a nada mais (REQ-62).
    group_add: ["10001"]
    volumes:
      - ./apps/backend/app:/app/app # hot-reload em desenvolvimento
      - pdfsock:/run/pdf:ro # a API só conecta no socket; não grava nada ali

  # ---------------------------------------------------------------------------
  # Processamento isolado de PDF (REQ-62): todo parsing acontece aqui.
  # Sem rede, raiz só leitura, sem capabilities, usuário sem privilégios,
  # limites de memória/CPU/processos e nenhuma variável de ambiente com segredo
  # (não usa o .env). A única porta de entrada é o socket Unix no volume pdfsock.
  # ---------------------------------------------------------------------------
  pdf-worker:
    build:
      context: ./apps/backend
      dockerfile: pdf_worker/Dockerfile
      target: runtime
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    volumes:
      - pdfsock:/run/pdf

  # ---------------------------------------------------------------------------
  # Testes do servidor do pdf-worker, que só rodam no Linux (socket Unix e
  # limites do sistema). Mesmo isolamento do worker.
  #   docker compose --profile test run --rm worker-tests
  # ---------------------------------------------------------------------------
  worker-tests:
    profiles: ["test"]
    build:
      context: ./apps/backend
      dockerfile: pdf_worker/Dockerfile
      target: test
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PYTHONPATH: /src
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./apps/backend:/src:ro

  # ---------------------------------------------------------------------------
  # Banco descartável para os testes automatizados
  #   docker compose --profile test up -d db-test
  # ---------------------------------------------------------------------------
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-saferdocs}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-saferdocs_test}
      POSTGRES_DB: saferdocs_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d saferdocs_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  pdfsock: # só o socket do pdf-worker; nenhum PDF é gravado aqui
