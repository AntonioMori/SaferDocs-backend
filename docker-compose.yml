services:
  # ---------------------------------------------------------------------------
  # Banco de dados PostgreSQL (credenciais vêm do apps/backend/.env)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ./apps/backend/.env
        required: true
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # API (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
    env_file:
      - path: ./apps/backend/.env
        required: true
    # Aplica as migrations pendentes e sobe a API com hot-reload.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/backend/app:/app/app # hot-reload em desenvolvimento

  # ---------------------------------------------------------------------------
  # Banco descartável para os testes automatizados
  #   docker compose --profile test up -d db-test
  # ---------------------------------------------------------------------------
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-saferdocs}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-saferdocs_test}
      POSTGRES_DB: saferdocs_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d saferdocs_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
