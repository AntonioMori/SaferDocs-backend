[project]
name = "saferdocs-backend"
version = "0.1.0"
description = "API REST do SaferDocs: assinatura digital de PDF"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# S105/S106 (senha hardcoded) disparam em nomes de enum como PASSWORD_CHANGED ou
# TOKEN_ISSUED e em fixtures de teste. Segredos reais só vêm do .env (RNF-05).
"app/services/audit_service.py" = ["S105"]
"app/services/security_events.py" = ["S105"]
"app/services/token_service.py" = ["S105"]
"app/crypto/aead.py" = ["S105"]
"scripts/dev_token.py" = ["S105"]
"tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
